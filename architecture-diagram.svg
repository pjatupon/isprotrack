    <text x="1224" y="550" font-size="13" fill="#4a4640">• AI Prompt Engineer ปรับ Prompt</text>
    <text x="1224" y="572" font-size="13" fill="#4a4640">• ตั้งค่าโมเดล/API ผ่านแอดมิน</text>
    <text x="1224" y="594" font-size="13" fill="#4a4640">• Audit Log ทุกการตัดสินใจ AI</text>
    <text x="1224" y="616" font-size="13" fill="#4a4640">• ผล AI = ฉบับร่าง ให้คนตรวจซ้ำ</text>
