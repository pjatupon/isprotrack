  <text x="40" y="768" font-size="14" font-weight="bold" fill="#c85f13">4. AI Core — โมเดลประมวลผล</text>
  <rect x="40" y="776" width="1520" height="116" rx="14" fill="#ffffff" stroke="#d8d0c8" stroke-width="1.5"/>
  <g>
    <rect x="64" y="802" width="720" height="72" rx="12" fill="#292724"/>
    <text x="90" y="828" font-size="18" font-weight="bold" fill="#ffffff">Gemini 2.5 Flash Lite</text>
    <text x="90" y="852" font-size="14" fill="#e8e4de">LLM + Vision — แชต / OCR / สกัด JSON / วิเคราะห์ ผ่านเกตเวย์ GenAI ม.ขอนแก่น</text>

    <rect x="804" y="802" width="720" height="72" rx="12" fill="#292724"/>
    <text x="830" y="828" font-size="18" font-weight="bold" fill="#ffffff">Local Hash Embedding (768 มิติ)</text>
    <text x="830" y="852" font-size="14" fill="#e8e4de">ค้นความหมายแบบ offline + cosine similarity (รองรับสลับเป็น text-embedding-004)</text>
  </g>

  <!-- arrow 4 -->
  <line x1="800" y1="896" x2="800" y2="938" stroke="#c85f13" stroke-width="3" marker-end="url(#arrow)"/>
