  <!-- ================= LAYER 5 : DATA ================= -->
  <text x="40" y="958" font-size="14" font-weight="bold" fill="#c85f13">5. Data / Storage</text>
  <rect x="40" y="966" width="1520" height="156" rx="14" fill="#ffffff" stroke="#d8d0c8" stroke-width="1.5"/>
  <g>
    <rect x="64" y="994" width="470" height="100" rx="12" fill="#f6f3ef" stroke="#c9c2b8" stroke-width="1.5"/>
