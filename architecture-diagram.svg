    <text x="605" y="170" text-anchor="middle" font-size="13" fill="#6b6760">ตรวจสอบ / อนุมัติแบบฟอร์ม</text>

    <rect x="820" y="120" width="350" height="70" rx="12" fill="#ffffff" stroke="#e87722" stroke-width="2"/>
    <text x="995" y="147" text-anchor="middle" font-size="20" font-weight="bold" fill="#292724">ผู้อนุมัติ</text>
    <text x="995" y="170" text-anchor="middle" font-size="13" fill="#6b6760">พิจารณาอนุมัติจัดซื้อ</text>

    <rect x="1210" y="120" width="350" height="70" rx="12" fill="#ffffff" stroke="#e87722" stroke-width="2"/>
    <text x="1385" y="147" text-anchor="middle" font-size="20" font-weight="bold" fill="#292724">ผู้ดูแลระบบ</text>
    <text x="1385" y="170" text-anchor="middle" font-size="13" fill="#6b6760">จัดการคลังความรู้ / ตั้งค่า AI</text>
  </g>

  <!-- arrow 1 -->
  <line x1="800" y1="194" x2="800" y2="238" stroke="#c85f13" stroke-width="3" marker-end="url(#arrow)"/>
