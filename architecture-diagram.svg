    <text x="80" y="616" font-size="13" fill="#4a4640">• บันทึกแชต + ส่งต่อข้อมูลร่าง TOR</text>

    <rect x="350" y="498" width="272" height="168" rx="12" fill="#fffaf5" stroke="#e0a06a" stroke-width="1.5"/>
