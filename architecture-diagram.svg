  <text x="40" y="458" font-size="14" font-weight="bold" fill="#c85f13">3. โมดูล AI ธุรกิจ (Business Logic — Server Components / Server Actions)</text>
  <rect x="40" y="466" width="1520" height="236" rx="14" fill="#ffffff" stroke="#d8d0c8" stroke-width="1.5"/>
  <g>
    <rect x="64" y="498" width="272" height="168" rx="12" fill="#fffaf5" stroke="#e0a06a" stroke-width="1.5"/>
