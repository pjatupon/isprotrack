      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c85f13"/>
    </marker>
    <marker id="arrowDk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
