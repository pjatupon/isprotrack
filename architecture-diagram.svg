  <rect x="0" y="0" width="1600" height="1210" fill="#f5f4f1"/>

  <!-- Title -->
  <text x="800" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#292724">สถาปัตยกรรมระบบ IS ProTrack — ระบบติดตามการจัดซื้อจัดจ้างด้วย AI (RAG)</text>
  <text x="800" y="84" text-anchor="middle" font-size="17" fill="#6b6760">คณะสหวิทยาการ มหาวิทยาลัยขอนแก่น | Gemini 2.5 Flash Lite (LLM + Vision) • Local Hash Embedding 768 มิติ • MariaDB/Prisma</text>

  <!-- ================= LAYER 1 : USERS ================= -->
