    <text x="366" y="550" font-size="13" fill="#4a4640">• Vision OCR สกัดข้อมูลผู้ขาย/รายการ</text>
    <text x="366" y="572" font-size="13" fill="#4a4640">• ตรวจความถูกต้องยอด/VAT</text>
    <text x="366" y="594" font-size="13" fill="#4a4640">• ตรวจจับความเสี่ยงล็อกสเปก</text>
    <text x="366" y="616" font-size="13" fill="#4a4640">• วิเคราะห์เทียบระเบียบ + workflow</text>

    <rect x="636" y="498" width="272" height="168" rx="12" fill="#fffaf5" stroke="#e0a06a" stroke-width="1.5"/>
    <text x="772" y="524" text-anchor="middle" font-size="16" font-weight="bold" fill="#a64610">ร่าง / ตรวจ TOR</text>
    <text x="652" y="550" font-size="13" fill="#4a4640">• ร่าง TOR โครงสร้างมาตรฐาน (JSON)</text>
    <text x="652" y="572" font-size="13" fill="#4a4640">• ตรวจล็อกสเปก / ถ้อยคำกำกวม</text>
    <text x="652" y="594" font-size="13" fill="#4a4640">• ตรวจความครบถ้วนตามระเบียบ</text>
    <text x="652" y="616" font-size="13" fill="#4a4640">• เก็บประวัติเวอร์ชัน + ส่งออก .docx</text>

    <rect x="922" y="498" width="272" height="168" rx="12" fill="#fffaf5" stroke="#e0a06a" stroke-width="1.5"/>
    <text x="1058" y="524" text-anchor="middle" font-size="16" font-weight="bold" fill="#a64610">แบบฟอร์มอัจฉริยะ</text>
    <text x="938" y="550" font-size="13" fill="#4a4640">• AI วิเคราะห์ช่องกรอกใน .docx</text>
    <text x="938" y="572" font-size="13" fill="#4a4640">• เลือกฟอร์มตามประเภท/วงเงิน</text>
    <text x="938" y="594" font-size="13" fill="#4a4640">• เติมข้อมูลอัตโนมัติ</text>
    <text x="938" y="616" font-size="13" fill="#4a4640">• ดาวน์โหลดไฟล์ Word ที่กรอกแล้ว</text>

    <rect x="1208" y="498" width="272" height="168" rx="12" fill="#fffaf5" stroke="#e0a06a" stroke-width="1.5"/>
