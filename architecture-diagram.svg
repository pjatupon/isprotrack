    <text x="299" y="1050" text-anchor="middle" font-size="13" fill="#4a4640">ผู้ใช้/สิทธิ์ คำขอ ใบเสนอราคา TOR</text>
    <text x="299" y="1070" text-anchor="middle" font-size="13" fill="#4a4640">แชต Session Audit Log</text>

    <rect x="549" y="994" width="470" height="100" rx="12" fill="#fdeee2" stroke="#e87722" stroke-width="1.5"/>
    <text x="784" y="1024" text-anchor="middle" font-size="16" font-weight="bold" fill="#a64610">คลังความรู้ระเบียบ (RAG)</text>
    <text x="784" y="1050" text-anchor="middle" font-size="13" fill="#4a4640">ระเบียบ/ตัวอย่าง/workflow → ตัด Chunk</text>
    <text x="784" y="1070" text-anchor="middle" font-size="13" fill="#4a4640">→ Embedding → ค้นด้วย Semantic Search</text>

    <rect x="1034" y="994" width="470" height="100" rx="12" fill="#f6f3ef" stroke="#c9c2b8" stroke-width="1.5"/>
    <text x="1269" y="1024" text-anchor="middle" font-size="16" font-weight="bold" fill="#292724">ไฟล์เอกสาร</text>
    <text x="1269" y="1050" text-anchor="middle" font-size="13" fill="#4a4640">PDF/ภาพ (MuPDF + Sharp)</text>
    <text x="1269" y="1070" text-anchor="middle" font-size="13" fill="#4a4640">.docx (PizZip + Docxtemplater)</text>
  </g>

  <!-- footer -->
  <rect x="40" y="1150" width="1520" height="40" rx="10" fill="#eef4f0" stroke="#cfe3d6" stroke-width="1.5"/>
  <text x="800" y="1175" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6b46">การไหลข้อมูล (RAG): คำถาม/เอกสาร → Embedding → ค้นหา Chunk ที่คล้าย → สร้างบริบท + citation → AI ตอบ (AI output = ฉบับร่าง ต้องให้เจ้าหน้าที่ตรวจสอบก่อนบันทึกเป็นทางการ)</text>
</svg>
